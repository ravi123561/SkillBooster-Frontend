<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SkillBooster</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-light" style="background-image: url('/assets/resgitration.png'); ">
    <div class="container mt-5">
        <div class="col-md-6 mx-auto card p-4 shadow-lg">
            <h2 class="text-center mb-4">Register To SkillBooster</h2>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name"  required>
                </div>

                <div class="mb-3">
                    <label for="phoneNum" class="form-label">Enter Mobile Number</label>
                    <input type="text" class="form-control" id="phoneNum" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="text" class="form-control" id="email" required>
                </div>

                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">Enter Password</label>
                    <input type="password" class="form-control" id="password" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword" style="position: absolute; right: 15px; top: 38px; cursor: pointer;"></i>
                </div>

                <div class="mb-3 position-relative">
                    <label for="ConfirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="ConfirmPassword" required>
                    <i class="fa-solid fa-eye toggle-password" id="cnftogglePassword" style="position: absolute; right: 15px; top: 38px; cursor: pointer;"></i>
                </div>

                <button type="submit" class="btn btn-warning	 w-100">Register</button>

            </form>

            <p class="mt-3 text-center">Already Registered? <a href="index.html" >Login</a> </p>
        </div>
    </div>



    <script>

        //password ke liye
        const togglePassword = document.getElementById("togglePassword")
        const passInput = document.getElementById("password")
        togglePassword.addEventListener("click", function(){
            const type = passInput.getAttribute("type")==="password"?"text":"password";
            passInput.setAttribute("type",type);
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        })

        //cnfpass ke liye
        const cnftogglePassword = document.getElementById("cnftogglePassword")
        const cnfPassInput = document.getElementById("ConfirmPassword")
        cnftogglePassword.addEventListener("click",function(){
            const type = cnfPassInput.getAttribute("type")==="password"?"text":"password";
            cnfPassInput.setAttribute("type",type);
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        })


        const form = document.getElementById("registerForm");
        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const phone = document.getElementById("phoneNum").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const ConfirmPassword = document.getElementById("ConfirmPassword").value;
            //check if password match
            if(password!==ConfirmPassword){
                alert("Passwrd do not Match!");
                return;
            }
            const user = {
                name,
                phone,
                email,
                password
            };


            localStorage.setItem("user",JSON.stringify(user));
            alert('Registration successful!');
            window.location.href = "index.html";
        });
    </script>
    
</body>
</html>
