<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout |  hello</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-image: url('/assets/secure\ login.jpg'); background-size: cover; background-repeat: no-repeat;">
  <div class="container mt-5">
    <div class="col-md-6 mx-auto card p-4 shadow-lg">
      <h2 class="text-center mb-4">Login To SkillBooster</h2>

      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3">
          <label for="pass" class="form-label">Password</label>
          <input type="password" class="form-control" id="pass" required>
        </div>

        <button class="btn btn-warning w-100" type="submit">Login</button>
      </form>

      <p class="mt-3">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script>
    const login = document.getElementById("loginForm");
    login.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("pass").value;
      const storedUser = JSON.parse(localStorage.getItem("user"));

      if (storedUser && storedUser.email === email && storedUser.password === password) {
        localStorage.setItem("loggedIn", "true");  // ✅ Correct key name
        alert("Login successful!");
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid email or password.");
      }
    });
  </script>
</body>
</html>
