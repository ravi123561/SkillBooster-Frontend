name: PureAgile Workflow Demo

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint started
        run: echo "Running lint checks..."

      - name: Lint completed
        run: echo "Lint successful"

  security-scan:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Security scan started
        run: echo "Scanning for vulnerabilities..."

      - name: Security scan completed
        run: echo "No vulnerabilities found"

  unit-tests:
    name: Unit Tests
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Unit tests started
        run: echo "Running unit tests..."

      - name: Unit tests completed
        run: echo "All unit tests passed"

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Integration tests started
        run: echo "Running integration tests..."

      - name: Integration tests completed
        run: echo "Integration tests passed"

  package:
    name: Package
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Package application
        run: echo "Packaging application..."

      - name: Package completed
        run: echo "Package created"

  deploy-staging:
    name: Deploy Staging
    needs: package
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging..."

      - name: Deployment completed
        run: echo "Deployment successful"
