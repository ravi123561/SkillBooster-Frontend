name: PureAgile Pipeline Test

on:
  workflow_dispatch:
    inputs:
      fail_stage:
        description: "Stage to fail"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - build
          - test
          - deploy

jobs:
  pipeline:
    name: Pipeline Started
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pipeline started"

  build:
    name: Build
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build started"
      - if: ${{ inputs.fail_stage == 'build' }}
        run: exit 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Test started"
      - if: ${{ inputs.fail_stage == 'test' }}
        run: exit 1

  deploy:
    name: Deploy Dev
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy started"
      - if: ${{ inputs.fail_stage == 'deploy' }}
        run: exit 1
      - run: echo "Deploy succeeded"
