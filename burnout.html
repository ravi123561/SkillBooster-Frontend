<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Burnout Alert</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-image: url('/assets/b1.webp'); background-size: cover; background-repeat: no-repeat;">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">SkillBooster</a>
    <div class="d-flex">
      <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
      <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<script>
  if(localStorage.getItem("loggedIn")!=="true"){
      window.location.href = "index.html";
  }
  function logout(){
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
  }
</script>


  <div class="container mt-5">
    <h2 class="mb-4">🧠 Burnout Alert</h2>
    <p>Track how much effort you're putting into your skills and get notified when to take a break.</p>

    <form id="burnoutForm">
      <div class="mb-3">
        <label for="hoursWorked" class="form-label">Hours Studied Today:</label>
        <input type="number" class="form-control" id="hoursWorked" placeholder="e.g. 5" required>
      </div>
      <button type="submit" class="btn btn-danger">Check Burnout</button>
    </form>

    <div id="alertMessage" class="mt-4"></div>
  </div>

  <script>
    document.getElementById('burnoutForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const hours = parseInt(document.getElementById('hoursWorked').value);
      const alertDiv = document.getElementById('alertMessage');

      if (hours >= 8) {
        alertDiv.innerHTML = '<div class="alert alert-danger">⚠️ High burnout risk! Take a break.</div>';
      } else if (hours >= 5) {
        alertDiv.innerHTML = '<div class="alert alert-warning">⚠️ Moderate effort. Monitor yourself.</div>';
      } else {
        alertDiv.innerHTML = '<div class="alert alert-success">✅ All good! Keep going steadily.</div>';
      }
    });
  </script>
</body>
</html>
