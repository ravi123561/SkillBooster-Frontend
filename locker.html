<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resource Locker | SkillBooster</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-image: url('/assets/lo.webp');  background-size: cover; background-repeat: no-repeat;">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html">SkillBooster</a>
    <div class="d-flex">
      <a href="dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
      <button class="btn btn-outline-light" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<script>
  if(localStorage.getItem("loggedIn")!=="true"){
      window.location.href = "index.html";
  }
  function logout(){
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
  }
</script>


  <div class="container mt-4">
    <h2 class="mb-3">📦 Resource Locker</h2>

    <form id="resourceForm" class="mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" class="form-control" id="title" placeholder="Title" required />
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" id="description" placeholder="Description" required />
        </div>
        <div class="col-md-4">
          <input type="url" class="form-control" id="link" placeholder="Link (https://...)" required />
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-success mt-2">Save Resource</button>
        </div>
      </div>
    </form>

    <div id="resourceList" class="row gy-3">
      <!-- Resources will be displayed here -->
    </div>
  </div>

  <script>
    const form = document.getElementById("resourceForm");
    const list = document.getElementById("resourceList");

    function getResources() {
      return JSON.parse(localStorage.getItem("resources")) || [];
    }

    function saveResources(resources) {
      localStorage.setItem("resources", JSON.stringify(resources));
    }

    function renderResources() {
      const resources = getResources();
      list.innerHTML = "";

      if (resources.length === 0) {
        list.innerHTML = "<p class='text-muted'>No resources added yet.</p>";
        return;
      }

      resources.forEach((res, index) => {
        const card = document.createElement("div");
        card.className = "col-md-6";
        card.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${res.title}</h5>
              <p class="card-text">${res.description}</p>
              <a href="${res.link}" target="_blank" class="btn btn-sm btn-primary">Open Link</a>
              <button class="btn btn-sm btn-danger float-end" onclick="deleteResource(${index})">Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function deleteResource(index) {
      const resources = getResources();
      resources.splice(index, 1);
      saveResources(resources);
      renderResources();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const link = document.getElementById("link").value.trim();

      const resources = getResources();
      resources.push({ title, description, link });
      saveResources(resources);
      renderResources();

      form.reset();
    });

    renderResources();
  </script>
</body>
</html>
